# Oaken Trunk: documented template. Copy to <config dir>/config.toml and edit what you change.
# Every section has defaults. Unknown top-level keys are an error.
# Secrets (SMTP AUTH passwords, API tokens, S3/Redis credentials) never go here.
version = 1

[server]
host = "127.0.0.1"          # bind loopback unless you opt in to more (non-loopback needs TLS and a signed scheme)
port = 8080                 # the one HTTP listener; surfaces come from the key and the operation
workers = 1                 # worker processes, each with its own event loop. 1..N or "auto"
                            # "auto" = usable CPUs (cgroup and affinity aware), capped by max_workers
max_workers = 8             # hard ceiling for "auto" and for any explicit value
threads_per_worker = 1      # blocking-I/O threads (fsync, file writes) per worker; 1 until tested
max_threads = 32            # hard ceiling on workers * threads_per_worker; startup fails above it
max_inflight = 64           # messages being received at once across ALL workers (exact: the
                            # supervisor hands workers batched credits)
max_message_size = "25MiB"  # over this, 552 / HTTP 413
retry_after_seconds = 30    # sent with 451 / 503 when we shed load

[ingest.smtp]
enabled = false             # planned
port = 587
auth = ["PLAIN", "LOGIN"]   # only offered after STARTTLS
accept_domains = []         # empty means refuse all recipients: no open relay

[ingest.lmtp]
enabled = false             # planned; the Postfix virtual_transport target
socket = "run/lmtp.sock"

[spool]
driver = "dir"              # dir | redis | s3-sqs (the last two are planned)

[spool.dir]
path = "data/spool"         # a tmpfs mount is the operator's choice, not a driver
durability = "strict"       # strict: fsync each message | batched: concurrent messages share one fsync
                            # (ack after it) | volatile: no fsync, explicit opt-in
max_spool_bytes = "20GiB"   # quota; at the limit new mail gets a retryable 4xx / HTTP 507
lease_seconds = 300
notify = "auto"             # auto | inotify | poll
poll_interval_ms = 500

# Every HTTP surface refuses unsigned requests before any route runs (ADR 0010).
# One line per surface changes the scheme; `steamer keys add --surface ingest` makes a key.
[security.ingest]
scheme = "ed25519"          # ed25519 (RFC 9421, default) | hmac | mtls | bearer (loopback only, warned)
keys_dir = "config/keys/ingest"   # public keys only for ed25519; files are mode 0600
max_clock_skew_seconds = 60

[security.consume]
scheme = "ed25519"
keys_dir = "config/keys/consume"

[security.admin]            # the management UI and the CLI's administrative operations
scheme = "ed25519"
keys_dir = "config/keys/admin"

[security.mcp]
scheme = "ed25519"
keys_dir = "config/keys/mcp"

[admin]                     # the management UI and, optionally, MCP on one listener
enabled = false
host = "127.0.0.1"
port = 8081
ui = true

[admin.mcp]                 # MCP is mounted at /mcp on this listener
enabled = false
local_only = true           # refuse non-loopback peers even with a valid signature
tier = "stats"              # stats by default; wider tiers need a deliberate change (ADR 0008)

[mailauth]                  # DKIM, SPF, DMARC, ARC (ADR 0011)
dkim_verify = true
spf = true                  # evaluated only when the client address is known
dmarc = "record"            # off | record | enforce
max_header_bytes = "64KiB"  # the only part of a message held in memory
trusted_hops = []           # upstream MTAs whose client address and Authentication-Results we trust

[mailauth.sign]             # outbound DKIM; private keys are owner-only files, never in this file
enabled = false
selector = "trunk"
key_file = "config/keys/dkim/trunk.pem"

[log]
level = "info"              # never logs content (ADR 0012)
envelope = "none"           # none | hashed (a keyed hash of sender and recipient)
