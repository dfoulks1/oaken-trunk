# Site registry. Every Markdown file under docs/ must be listed here or excluded below,
# otherwise check_docs.py reports it as an orphan.

exclude = ["adr/0*.md"]

[site]
title = "Oaken Trunk"
description = "A stateless mail gateway with a durable spool."
repo = "https://github.com/dfoulks1/oaken-trunk"
url = "https://dfoulks1.github.io/oaken-trunk/"
branch = "main"
home = "index.md"

[[groups]]
id = "start"
name = "Start"

[[groups]]
id = "concepts"
name = "Concepts"

[[groups]]
id = "reference"
name = "Reference"

[[groups]]
id = "project"
name = "Project"

[check]
allow_hosts = ["www.apache.org", "www.contributor-covenant.org", "www.rfc-editor.org"]

