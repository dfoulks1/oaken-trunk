# Software map data. Edit it in the same change that builds or alters a component.
#   status  built | partial | planned. built/partial -> `path` must exist; planned -> must not.
#   prompt  the build prompt that delivers it.
#   uses    direct calls into other components: same layer or lower, never up, no cycles.

[[stacks]]
id = "gateway"
name = "Oaken Trunk gateway"
layers = ["clients", "ingestors", "core", "plugins"]

[[layers]]
id = "clients"
name = "Clients"

[[layers]]
id = "ingestors"
name = "Ingestors"

[[layers]]
id = "core"
name = "Core"

[[layers]]
id = "plugins"
name = "Plugins"

[[components]]
id = "lmtp"
name = "LMTP ingest"
layer = "ingestors"
status = "planned"
prompt = "PLUGIN_mail-protocols"
summary = "The Postfix delivery target over a Unix or TCP socket."
uses = ["registry"]
untrusted = true

[[components]]
id = "smtp"
name = "SMTP ingest"
layer = "ingestors"
status = "planned"
prompt = "PLUGIN_smtp-ingest"
summary = "SMTP on 25 and 587 with STARTTLS, AUTH after TLS and a recipient allowlist."
uses = ["registry"]
untrusted = true

[[components]]
id = "engine"
name = "Engine"
layer = "core"
status = "planned"
prompt = "CORE_engine"
summary = "The data path. Applies limits, assigns a message id, streams the body into a spool through a writer in bounded chunks, fires listener events in order, and commits."
uses = ["host", "plugin-base"]

[[components]]
id = "registry"
name = "Operation registry"
layer = "core"
status = "planned"
prompt = "CORE_operation-registry"
summary = "The command path. Every capability is one typed operation with a surface, a permission class and an MCP ceiling. The API, CLI, UI and MCP are generated from it."
uses = ["engine", "host"]

[[components]]
id = "daemon"
name = "Daemon"
layer = "core"
status = "planned"
prompt = "CORE_daemon"
summary = "Runs core as one process: composition root, start, stop, reload and graceful shutdown, serving the registry over a local Unix socket."
uses = ["registry"]

[[components]]
id = "httplistener"
name = "HTTP listener"
layer = "core"
status = "planned"
prompt = "CORE_http-listener"
summary = "The TCP and TLS listener with the request guard in front. HTTP submission is the submit operation on the ingest surface."
uses = ["daemon", "guard"]

[[components]]
id = "sysops"
name = "System operations"
layer = "core"
status = "planned"
prompt = "CORE_system-operations"
summary = "init, doctor, status, stats, config and plugin operations: what an operator needs to set up and watch Trunk."
uses = ["registry"]

[[components]]
id = "audit"
name = "Audit and jobs"
layer = "core"
status = "planned"
prompt = "CORE_audit-and-jobs"
summary = "A content-free audit log, a stats rollup, and the job runner with the lease reaper, in a small SQLite file beside the spool."
uses = ["registry"]

[[components]]
id = "supervisor"
name = "Supervisor and workers"
layer = "core"
status = "planned"
prompt = "CORE_supervisor"
summary = "Opens the sockets, runs the worker processes, hands out batched credits for global limits and restarts crashed workers."
uses = ["engine"]

[[components]]
id = "guard"
name = "Request guard and authenticators"
layer = "core"
status = "planned"
prompt = "CORE_request-guard"
summary = "One guard in front of every HTTP surface that refuses unsigned, stale, replayed or cross-surface requests before any route runs. The signing scheme is an authenticator plugin chosen per surface."
uses = ["plugin-base"]
untrusted = true

[[components]]
id = "mailauth"
name = "Mail authentication"
layer = "core"
status = "planned"
prompt = "CORE_mail-authentication"
summary = "Native DKIM verification and signing, with SPF, DMARC and ARC where the client address is known. Holds only the header block in memory and hashes the body as it streams."
uses = ["plugin-base"]
untrusted = true

[[components]]
id = "host"
name = "Plugin host"
layer = "core"
status = "planned"
prompt = "CORE_plugin-host"
summary = "Discovers plugins through entry points and runs their lifecycle, health and doctor checks."
uses = ["plugin-base"]

[[components]]
id = "plugin-base"
name = "Plugin base classes and contract suites"
layer = "plugins"
status = "planned"
prompt = "CORE_plugin-host"
summary = "BaseStore, BaseLineServer (BaseIngestor, BaseRetriever) and BaseSender, with capabilities inferred from overridden methods, plus the shared contract test suites."
uses = []

[[components]]
id = "spool-dir"
name = "Directory store"
layer = "plugins"
status = "planned"
prompt = "PLUGIN_directory-spool"
summary = "The default store: blobs as files, indexes as journals, compare-and-set by rename, fsync by durability mode."
uses = ["plugin-base"]

[[components]]
id = "spool-redis"
name = "Redis store"
layer = "plugins"
status = "planned"
prompt = "PLUGIN_redis-spool"
summary = "Store primitives on Redis for queues and coordination across hosts, with Lua fast paths for commit and ack."
uses = ["plugin-base"]

[[components]]
id = "spool-s3-sqs"
name = "S3 store"
layer = "plugins"
status = "planned"
prompt = "PLUGIN_s3-sqs-spool"
summary = "Store primitives on S3: bodies at scale, queues as listable prefixes, SQS as an optional wake-up."
uses = ["plugin-base"]

[[components]]
id = "send"
name = "Outbound sender"
layer = "plugins"
status = "planned"
prompt = "CORE_send"
summary = "Drains the outbound spool with per-domain limits, backoff and bounces."
uses = ["plugin-base"]

[[components]]
id = "cli"
name = "CLI"
layer = "clients"
status = "planned"
prompt = "CLI_client"
summary = "The `steamer` command, a thin client of the API. Every operation has a command. In-process mode is an explicit flag for offline operations only."
uses = ["daemon"]

[[components]]
id = "webui"
name = "Management UI"
layer = "clients"
status = "planned"
prompt = "WEBUI_management-ui"
summary = "A separate web app on its own port for the operator, built only on operations the CLI already has. Off by default."
uses = ["cli"]

[[components]]
id = "statsmcp"
name = "MCP door"
layer = "clients"
status = "planned"
prompt = "MCP_mcp-door"
summary = "Optional MCP door generated from the whole operation registry and gated by a caller class the mount sets. Statistics tier by default, a confirm gate for state changes, and never message data or send, delete and the lease/ack verbs."
uses = ["cli"]
untrusted = true

[[components]]
id = "pop3"
name = "POP3 retriever"
layer = "ingestors"
status = "planned"
prompt = "PLUGIN_mail-protocols"
summary = "Mail clients read their device queue over POP3; DELE then QUIT is the ack."
uses = ["registry", "linesrv"]
untrusted = true

[[components]]
id = "sasl"
name = "SASL bridge"
layer = "ingestors"
status = "planned"
prompt = "PLUGIN_mail-protocols"
summary = "A Dovecot-auth socket so Postfix submission checks device tokens."
uses = ["linesrv"]
untrusted = true

[[components]]
id = "linesrv"
name = "Line server"
layer = "core"
status = "planned"
prompt = "CORE_line-server"
summary = "One base under every socket protocol: TLS, limits, login, dot-stuffing, fuzzing, and the retriever session."
uses = ["guard", "store"]

[[components]]
id = "store"
name = "Spool and registry"
layer = "core"
status = "planned"
prompt = "CORE_store"
summary = "Core spool, locks, counters and the registry, built on store primitives; fan-out per device and the caps."
uses = ["encryption", "plugin-base"]

[[components]]
id = "encryption"
name = "Encryption at rest"
layer = "core"
status = "planned"
prompt = "CORE_encryption"
summary = "Streaming envelope encryption of every blob and record before a store sees it."
uses = []

[[components]]
id = "enrollment"
name = "Device enrollment"
layer = "core"
status = "planned"
prompt = "CORE_enrollment"
summary = "Self-service device tokens: an authenticated request for a token for a named device."
uses = ["registry", "store"]

[[components]]
id = "diagnostics"
name = "Diagnostics"
layer = "core"
status = "planned"
prompt = "CORE_diagnostics"
summary = "Mail-path checks for doctor, and trace, devices, refusals and probe."
uses = ["sysops", "audit", "store"]
