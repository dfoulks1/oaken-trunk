# Software map data. Edit it in the same change that builds or alters a component.
#   status  built | partial | planned. built/partial -> `path` must exist; planned -> must not.
#   prompt  the build prompt that delivers it.
#   uses    direct calls into other components: same layer or lower, never up, no cycles.

[[stacks]]
id = "gateway"
name = "Oaken Trunk gateway"
layers = ["clients", "protocols", "doors", "core", "storage", "plugins"]

[[layers]]
id = "clients"
name = "Clients"

[[layers]]
id = "protocols"
name = "Protocols"

[[layers]]
id = "doors"
name = "Doors"

[[layers]]
id = "core"
name = "Core"

[[layers]]
id = "storage"
name = "Storage"

[[layers]]
id = "plugins"
name = "Plugins"

# Clients: operator and admin tools. Mail clients and Oaken Mail sit outside, on the protocols and doors.

[[components]]
id = "cli"
name = "CLI"
layer = "clients"
status = "partial"
path = "src/oaken_trunk/cli.py"
prompt = "CLI_client"
summary = "The `steamer` command, a thin client of the API. Every operation has a command. In-process mode is an explicit flag for offline operations only. Built so far: `steamer --version` (CORE_bootstrap)."
uses = ["daemon"]

[[components]]
id = "mta"
name = "MTA adapters"
layer = "clients"
status = "planned"
prompt = "PLUGIN_mta-adapters"
summary = "`steamer qmail submit` and `steamer postfix submit`: each MTA's environment and exit codes, mapped onto `submit`."
uses = ["cli"]
untrusted = true

[[components]]
id = "webui"
name = "Management UI"
layer = "clients"
status = "planned"
prompt = "WEBUI_management-ui"
summary = "A separate web app on its own port, read only: status, queue, leases, failures, configuration, `doctor`. Off by default."
uses = ["httplistener"]

[[components]]
id = "webui-actions"
name = "Operator actions"
layer = "clients"
status = "planned"
prompt = "WEBUI_operator-actions"
summary = "Diagnostics pages and the CLI's mutating actions in the web UI, each confirmed and audited."
uses = ["webui"]

[[components]]
id = "mcp"
name = "MCP door"
layer = "clients"
status = "planned"
prompt = "MCP_mcp-door"
summary = "Diagnostics for a model, off by default. The operator enables read-only diagnostic operations one by one; anything touching mail or keys can never be enabled."
uses = ["httplistener"]

# Protocols: command tables on the line server. Each speaks to the outside and handles untrusted input.

[[components]]
id = "lmtp"
name = "LMTP"
layer = "protocols"
status = "planned"
prompt = "PLUGIN_mail-protocols"
summary = "Postfix delivers here. Unknown users get Dovecot's `550 5.1.1`; caps get `452 4.3.1`."
uses = ["linesrv"]
untrusted = true

[[components]]
id = "smtp"
name = "SMTP"
layer = "protocols"
status = "planned"
prompt = "PLUGIN_smtp-ingest"
summary = "SMTP on 25 and 587 with STARTTLS, AUTH after TLS and a recipient allowlist. Later."
uses = ["linesrv"]
untrusted = true

[[components]]
id = "pop3"
name = "POP3"
layer = "protocols"
status = "planned"
prompt = "PLUGIN_mail-protocols"
summary = "Mail clients read their device queue. `RETR` claims, `DELE` marks, a clean `QUIT` acks."
uses = ["linesrv"]
untrusted = true

[[components]]
id = "sasl"
name = "SASL bridge"
layer = "protocols"
status = "planned"
prompt = "PLUGIN_mail-protocols"
summary = "A Dovecot-auth socket so Postfix submission checks device tokens."
uses = ["linesrv"]
untrusted = true

# Doors: where a request or a connection is authenticated before it reaches core.

[[components]]
id = "linesrv"
name = "Line server"
layer = "doors"
status = "planned"
prompt = "CORE_line-server"
summary = "One base under every socket protocol: TLS, limits, login, dot-stuffing, fuzzing, and the retriever session as a transaction."
uses = ["keys", "registry", "consumer"]

[[components]]
id = "httplistener"
name = "HTTP listener"
layer = "doors"
status = "planned"
prompt = "CORE_http-listener"
summary = "TCP and TLS with the guard in front; HTTP `submit` on the ingest surface; the consumer API and enrollment over HTTP."
uses = ["guard", "registry"]
untrusted = true

[[components]]
id = "enrollment"
name = "Enrollment"
layer = "doors"
status = "planned"
prompt = "CORE_enrollment"
summary = "Self-service device tokens: an authenticated request for a token for a named device."
uses = ["keys", "registry"]

[[components]]
id = "keys"
name = "Keys and tokens"
layer = "doors"
status = "planned"
prompt = "CORE_keys"
summary = "`apptoken` and `bearer` authenticators, and key operations kept in the registry, live on every host."
uses = ["guard", "store"]

[[components]]
id = "guard"
name = "Request guard"
layer = "doors"
status = "planned"
prompt = "CORE_request-guard"
summary = "One guard in front of every HTTP surface: the authenticator kind, surfaces, ed25519 signed requests, freshness and replay."
uses = ["store", "host"]

# Core: the command path, the data path and the operator's operations.

[[components]]
id = "daemon"
name = "Daemon"
layer = "core"
status = "planned"
prompt = "CORE_daemon"
summary = "The composition root: lifecycle, and the registry served over a local Unix socket."
uses = ["registry", "supervisor"]

[[components]]
id = "registry"
name = "Operation registry"
layer = "core"
status = "planned"
prompt = "CORE_operation-registry"
summary = "The command path. Every capability is one typed operation with a surface, a permission and an MCP setting. The API, CLI, UI and MCP are doors onto it."
uses = ["engine", "consumer", "sysops", "diagnostics", "audit", "host"]

[[components]]
id = "consumer"
name = "Consumer API"
layer = "core"
status = "planned"
prompt = "CORE_consumer-api"
summary = "Lease, fetch, ack, nack and renew per device, with long-poll wake-up and poison handling."
uses = ["store"]

[[components]]
id = "engine"
name = "Engine"
layer = "core"
status = "planned"
prompt = "CORE_engine"
summary = "The data path: limits, recipients, the header block and digests, listener events, and the commit into the spool in bounded chunks."
uses = ["mailauth", "store", "host"]

[[components]]
id = "mailauth"
name = "Mail authentication"
layer = "core"
status = "planned"
prompt = "CORE_mail-authentication"
summary = "The streaming authentication stage, a resolver, `Authentication-Results` and DKIM. Holds only the header block. Later."
uses = ["mailpolicy"]

[[components]]
id = "mailpolicy"
name = "Mail policy"
layer = "core"
status = "planned"
prompt = "CORE_mail-policy"
summary = "SPF, DMARC (record or enforce) and ARC (record only) on the authentication stage. Later."
uses = []

[[components]]
id = "sysops"
name = "System operations"
layer = "core"
status = "planned"
prompt = "CORE_system-operations"
summary = "`init`, `doctor`, `status`, `stats` and the config operations."
uses = ["store"]

[[components]]
id = "diagnostics"
name = "Diagnostics"
layer = "core"
status = "planned"
prompt = "CORE_diagnostics"
summary = "Mail-path checks for `doctor`, and `trace`, `devices`, `refusals` and `probe`. Metadata only."
uses = ["sysops", "audit", "store"]

[[components]]
id = "audit"
name = "Audit and checkup"
layer = "core"
status = "planned"
prompt = "CORE_audit-and-jobs"
summary = "The content-free audit log, stats rollup, the job runner and `checkup`, the maintenance sweep."
uses = ["store"]

[[components]]
id = "supervisor"
name = "Supervisor"
layer = "core"
status = "planned"
prompt = "CORE_supervisor"
summary = "Workers, their lifecycle, and `Locks`, `Credits` and `NonceStore` across workers and hosts."
uses = ["store"]

[[components]]
id = "host"
name = "Plugin host"
layer = "core"
status = "planned"
prompt = "CORE_plugin-host"
summary = "Entry-point discovery, plugin lifecycle, `@command`, and the listener and MTA kinds."
uses = ["plugin-base"]

# Storage: the spool, the registry and encryption, built on store primitives.

[[components]]
id = "store"
name = "Spool and registry"
layer = "storage"
status = "planned"
prompt = "CORE_store"
summary = "Fan-out per device, lease, ack, cleanup, the caps, locks and counters, and the registry, all on store primitives."
uses = ["encryption", "plugin-base"]

[[components]]
id = "encryption"
name = "Encryption at rest"
layer = "storage"
status = "planned"
prompt = "CORE_encryption"
summary = "Streaming envelope encryption of every blob and record before a store sees it."
uses = ["plugin-base"]

# Plugins: base classes and the backends that implement them.

[[components]]
id = "plugin-base"
name = "Base classes"
layer = "plugins"
status = "planned"
prompt = "CORE_plugin-host"
summary = "`BaseStore`, `BaseLineServer` (`BaseIngestor`, `BaseRetriever`), `BaseAuthenticator`, `BaseListener` and `BaseSender`, each with its contract suite."
uses = []

[[components]]
id = "store-dir"
name = "Directory store"
layer = "plugins"
status = "planned"
prompt = "PLUGIN_directory-spool"
summary = "The default store: blobs as files, indexes as journals, compare-and-set by rename. One host."
uses = ["plugin-base"]

[[components]]
id = "store-redis"
name = "Redis store"
layer = "plugins"
status = "planned"
prompt = "PLUGIN_redis-spool"
summary = "Queues and coordination across hosts, with Lua fast paths. Later."
uses = ["plugin-base"]

[[components]]
id = "store-s3"
name = "S3 store"
layer = "plugins"
status = "planned"
prompt = "PLUGIN_s3-sqs-spool"
summary = "Bodies at scale, queues as listable prefixes, SQS as an optional wake-up. Later."
uses = ["plugin-base"]

[[components]]
id = "send"
name = "Outbound sender"
layer = "plugins"
status = "planned"
prompt = "CORE_send"
summary = "The Sender kind and outbound DKIM signing. Later."
uses = ["plugin-base"]
